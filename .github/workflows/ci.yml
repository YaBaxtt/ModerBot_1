name: ModerBot CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BOT_TOKEN: ci-token
      DATABASE_URL: sqlite+aiosqlite:///ci.db
      OWNER_IDS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check installed dependencies
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Verify database migrations
        run: |
          python -m alembic upgrade head
          python -m alembic check

      - name: Run test suite
        shell: bash
        run: |
          set +e
          set -o pipefail
          python -m pytest -q --tb=short 2>&1 | tee pytest-output.txt
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            details=$(tail -c 6000 pytest-output.txt)
            details=${details//'%'/'%25'}
            details=${details//$'\r'/'%0D'}
            details=${details//$'\n'/'%0A'}
            echo "::error title=Pytest failed::$details"
            exit "$status"
          fi

      - name: Verify production Docker image
        run: docker build --tag moderbot-ci:${{ github.sha }} .
